<?xml version="1.0" encoding="UTF-8"?>
<!-- Macula agent-mesh architecture diagram. A coding agent (Claude Code)
     reaches the Macula mesh through macula-mcp and calls real, deployed
     edge services: an honest picture of one real workflow, not a
     product-announcement banner like this repo's other cards. The mesh
     itself is drawn as the central hub circle, with macula-symbol-dark.svg
     embedded verbatim at its native 100x100 geometry (not redrawn), and
     services arranged radially around it. This is the hub-and-spoke
     convention this repo now uses for architecture diagrams, distinct
     from the linear badge-row convention the announcement banners use.
     macula-mcp's plug badge is reused verbatim from
     macula-deployables-announcement.svg. Same palette/typography as the
     rest of this repo (see README.md's Colors table). 1200x630,
     LinkedIn-safe single-image post size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1220"/>

  <!-- Header -->
  <text x="600" y="30" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
        font-size="24" font-weight="700" fill="#0EA5E9" letter-spacing="-0.5px">MACULA MESH</text>
  <text x="600" y="52" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
        font-size="14" fill="#94A3B8">A coding agent, wired into the commons</text>

  <!-- ============ Spokes: hub to each service (dashed = passive mesh reach) ============ -->
  <!-- Hub center (600,340), radius 62. Service badges sit on a ring at
       radius 175 from center. -->
  <g stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.55" fill="none">
    <line x1="600" y1="278" x2="600" y2="185"/>
    <line x1="646" y1="288" x2="737" y2="231"/>
    <line x1="666" y1="333" x2="771" y2="379"/>
    <line x1="644" y1="378" x2="676" y2="498"/>
    <line x1="556" y1="378" x2="524" y2="498"/>
    <line x1="534" y1="333" x2="429" y2="379"/>
    <line x1="554" y1="288" x2="463" y2="231"/>
  </g>

  <!-- ============ Central hub: the mesh itself ============ -->
  <circle cx="600" cy="340" r="62" fill="#0C1929" stroke="#0EA5E9" stroke-width="3"/>

  <!-- macula-symbol-dark.svg, embedded verbatim at native 100x100 geometry,
       translated/scaled to sit centered in the hub circle above. -->
  <g transform="translate(551,291) scale(0.98)">
    <g stroke="#38BDF8" stroke-width="1.5" fill="none">
      <line x1="22" y1="20" x2="50" y2="32"/>
      <line x1="50" y1="32" x2="78" y2="18"/>
      <line x1="22" y1="20" x2="15" y2="52"/>
      <line x1="78" y1="18" x2="85" y2="45"/>
      <line x1="15" y1="52" x2="35" y2="55"/>
      <line x1="35" y1="55" x2="50" y2="50"/>
      <line x1="50" y1="50" x2="68" y2="48"/>
      <line x1="68" y1="48" x2="85" y2="45"/>
      <line x1="15" y1="52" x2="28" y2="80"/>
      <line x1="35" y1="55" x2="50" y2="78"/>
      <line x1="50" y1="50" x2="50" y2="78"/>
      <line x1="68" y1="48" x2="72" y2="75"/>
      <line x1="85" y1="45" x2="72" y2="75"/>
      <line x1="28" y1="80" x2="50" y2="78"/>
      <line x1="50" y1="78" x2="72" y2="75"/>
      <line x1="22" y1="20" x2="35" y2="55" stroke-dasharray="3,2" opacity="0.5"/>
      <line x1="78" y1="18" x2="68" y2="48" stroke-dasharray="3,2" opacity="0.5"/>
      <line x1="50" y1="32" x2="50" y2="50" stroke-dasharray="3,2" opacity="0.5"/>
    </g>
    <g stroke="#FB923C" stroke-width="2" fill="none">
      <line x1="35" y1="55" x2="68" y2="48"/>
      <line x1="50" y1="32" x2="35" y2="55" stroke-dasharray="4,3"/>
    </g>
    <g stroke="#38BDF8" stroke-width="2" fill="#1E293B">
      <circle cx="22" cy="20" r="5"/>
      <circle cx="78" cy="18" r="5"/>
      <circle cx="15" cy="52" r="4"/>
      <circle cx="85" cy="45" r="4"/>
      <circle cx="28" cy="80" r="5"/>
      <circle cx="72" cy="75" r="5"/>
    </g>
    <g stroke="#38BDF8" stroke-width="2" fill="#F8FAFC">
      <circle cx="50" cy="32" r="5"/>
      <circle cx="50" cy="78" r="5"/>
    </g>
    <circle cx="50" cy="50" r="8" stroke="#38BDF8" stroke-width="2" fill="#1E293B"/>
    <circle cx="50" cy="50" r="4" fill="#38BDF8"/>
    <g stroke="#38BDF8" stroke-width="1.5" fill="#1E293B">
      <circle cx="35" cy="55" r="4"/>
      <circle cx="68" cy="48" r="4"/>
    </g>
    <g fill="#FB923C">
      <circle cx="35" cy="55" r="2"/>
      <circle cx="68" cy="48" r="2"/>
    </g>
  </g>

  <!-- ============ Agent -> macula-mcp, the active path entering the hub ============ -->
  <line x1="600" y1="153" x2="600" y2="278" stroke="#F97316" stroke-width="2.5"/>

  <g>
    <circle cx="600" cy="125" r="28" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <g transform="translate(586,111)" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M9,10 L9,17 A3,3 0 0 0 12,20 L14,20 A3,3 0 0 0 17,17 L17,10"/>
      <line x1="11" y1="6" x2="11" y2="10"/>
      <line x1="15" y1="6" x2="15" y2="10"/>
      <line x1="13" y1="20" x2="13" y2="24"/>
    </g>
    <text x="600" y="171" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
          font-size="14" font-weight="600" fill="#E2E8F0">macula-mcp</text>
  </g>

  <!-- Coding Agent, connecting into mcp from the left -->
  <line x1="418" y1="125" x2="572" y2="125" stroke="#F97316" stroke-width="2.5"/>
  <g>
    <circle cx="374" cy="125" r="28" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <g transform="translate(360,111)" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M9,9 L16,16 L9,23"/>
      <line x1="18" y1="23" x2="25" y2="23"/>
    </g>
    <circle cx="393" cy="106" r="3.5" fill="#F97316"/>
    <text x="374" y="171" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
          font-size="14" font-weight="600" fill="#E2E8F0">Coding Agent</text>
    <text x="374" y="186" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
          font-size="10" fill="#64748B">Claude Code</text>
  </g>

  <!-- ============ Services, on the ring ============ -->

  <!-- Graph (upper right) -->
  <g>
    <circle cx="737" cy="231" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(723,217)" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" fill="none">
      <line x1="4" y1="18" x2="14" y2="6"/>
      <line x1="14" y1="6" x2="24" y2="14"/>
      <line x1="4" y1="18" x2="24" y2="14"/>
    </g>
    <g fill="#F97316">
      <circle cx="727" cy="223" r="2"/>
      <circle cx="737" cy="217" r="2"/>
      <circle cx="747" cy="231" r="2"/>
    </g>
    <text x="737" y="274" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="14" font-weight="600" fill="#E2E8F0">Graph</text>
    <text x="737" y="290" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="10" fill="#64748B">hecate-graph</text>
  </g>

  <!-- LLM (right) -->
  <g>
    <circle cx="771" cy="379" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(757,365)" fill="#F8FAFC">
      <path d="M14,4 L16.4,11.6 L24,14 L16.4,16.4 L14,24 L11.6,16.4 L4,14 L11.6,11.6 Z"/>
    </g>
    <text x="806" y="379" text-anchor="start" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="14" font-weight="600" fill="#E2E8F0">LLM</text>
    <text x="806" y="394" text-anchor="start" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="10" fill="#64748B">hecate-llm</text>
  </g>

  <!-- RAG (lower right) -->
  <g>
    <circle cx="676" cy="498" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(662,484)" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M5,5 L5,23 L23,23 L23,5 Z"/>
      <line x1="9" y1="10" x2="19" y2="10"/>
      <line x1="9" y1="14" x2="19" y2="14"/>
      <line x1="9" y1="18" x2="15" y2="18"/>
    </g>
    <text x="676" y="541" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="14" font-weight="600" fill="#E2E8F0">RAG</text>
    <text x="676" y="557" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="10" fill="#64748B">hecate-rag</text>
  </g>

  <!-- Sentinel (lower left) -->
  <g>
    <circle cx="524" cy="498" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(510,483)" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M14,4 L24,8 L24,15 C24,20 19.5,24 14,26 C8.5,24 4,20 4,15 L4,8 Z"/>
    </g>
    <text x="524" y="541" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="14" font-weight="600" fill="#E2E8F0">Sentinel</text>
    <text x="524" y="557" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="10" fill="#64748B">hecate-sentinel</text>
  </g>

  <!-- Mail (left) -->
  <g>
    <circle cx="429" cy="379" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(415,367)" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="6" width="20" height="15" rx="1.5"/>
      <path d="M4,7 L14,15 L24,7"/>
    </g>
    <text x="394" y="379" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="14" font-weight="600" fill="#E2E8F0">Mail</text>
    <text x="394" y="394" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="10" fill="#64748B">hecate-mail</text>
  </g>

  <!-- Stations (upper left) -->
  <g>
    <circle cx="463" cy="231" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(449,217)">
      <path d="M12,22 L12,8 M8,22 L12,14 L16,22 M6,22 L18,22"
            fill="none" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="6" r="1.4" fill="#F8FAFC"/>
      <path d="M15,4 A3,3 0 0 1 15,8" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M9,4 A3,3 0 0 0 9,8" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text x="428" y="274" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="14" font-weight="600" fill="#E2E8F0">Stations</text>
    <text x="428" y="290" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="10" fill="#64748B">hecate-stations</text>
  </g>

</svg>
