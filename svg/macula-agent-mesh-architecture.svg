<?xml version="1.0" encoding="UTF-8"?>
<!-- Macula agent-mesh architecture diagram. A coding agent (Claude Code) reaches
     the Macula mesh through macula-mcp and calls real edge services deployed on
     it: not a product-announcement banner like the SDK/deployables/ecosystem
     cards in this repo, an honest picture of one real workflow: agent -> MCP ->
     mesh -> service. Same palette/typography as the rest of this repo (see
     README.md's Colors table); MCP's plug badge and the mesh-node motif are
     reused verbatim from macula-deployables-announcement.svg, not redrawn.
     1200x630, LinkedIn-safe single-image post size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1220"/>

  <!-- Header -->
  <text x="600" y="54" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
        font-size="30" font-weight="700" fill="#0EA5E9" letter-spacing="-0.5px">MACULA MESH</text>
  <text x="600" y="82" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
        font-size="17" fill="#94A3B8">A coding agent, wired into the commons</text>

  <line x1="300" y1="106" x2="900" y2="106" stroke="#1E293B" stroke-width="1"/>

  <!-- ============ Agent -> macula-mcp flow ============ -->

  <!-- Connector: agent to mcp (orange = active connection, per this repo's own legend) -->
  <line x1="286" y1="200" x2="474" y2="200" stroke="#F97316" stroke-width="2.5"/>

  <!-- Coding Agent badge -->
  <g>
    <circle cx="240" cy="200" r="34" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <g transform="translate(224,184)" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M9,9 L16,16 L9,23"/>
      <line x1="18" y1="23" x2="25" y2="23"/>
    </g>
    <circle cx="260" cy="180" r="3.5" fill="#F97316"/>
    <text x="240" y="256" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
          font-size="19" font-weight="600" fill="#E2E8F0">Coding Agent</text>
    <text x="240" y="278" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
          font-size="13" fill="#64748B">Claude Code</text>
  </g>

  <!-- macula-mcp badge (plug icon reused verbatim from macula-deployables-announcement.svg) -->
  <g>
    <circle cx="520" cy="200" r="34" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <g transform="translate(504,184)" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M9,10 L9,17 A3,3 0 0 0 12,20 L14,20 A3,3 0 0 0 17,17 L17,10"/>
      <line x1="11" y1="6" x2="11" y2="10"/>
      <line x1="15" y1="6" x2="15" y2="10"/>
      <line x1="13" y1="20" x2="13" y2="24"/>
    </g>
    <text x="520" y="256" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
          font-size="19" font-weight="600" fill="#E2E8F0">macula-mcp</text>
    <text x="520" y="278" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
          font-size="13" fill="#64748B">mesh_call · mesh_recall</text>
  </g>

  <!-- macula-mcp reaches the station mesh -->
  <line x1="554" y1="200" x2="660" y2="200" stroke="#0EA5E9" stroke-width="2"/>

  <!-- Small mesh-hub motif (same irregular-mesh + hub visual language as the
       macula wordmark icon, at a smaller scale) representing "the mesh" itself -->
  <g transform="translate(660,168) scale(0.64)">
    <g stroke="#0EA5E9" stroke-width="1.5" fill="none" opacity="0.85">
      <line x1="10" y1="8" x2="35" y2="20"/>
      <line x1="35" y1="20" x2="60" y2="6"/>
      <line x1="10" y1="8" x2="6" y2="38"/>
      <line x1="60" y1="6" x2="64" y2="34"/>
      <line x1="6" y1="38" x2="35" y2="50"/>
      <line x1="35" y1="50" x2="64" y2="34"/>
      <line x1="10" y1="8" x2="35" y2="50" stroke-dasharray="3,2" opacity="0.6"/>
      <line x1="60" y1="6" x2="35" y2="50" stroke-dasharray="3,2" opacity="0.6"/>
    </g>
    <g stroke="#0EA5E9" stroke-width="2" fill="#0C1929">
      <circle cx="10" cy="8" r="3.5"/>
      <circle cx="60" cy="6" r="3.5"/>
      <circle cx="6" cy="38" r="3"/>
      <circle cx="64" cy="34" r="3"/>
    </g>
    <circle cx="35" cy="20" r="5.5" stroke="#0EA5E9" stroke-width="2" fill="#0C1929"/>
    <circle cx="35" cy="20" r="2.5" fill="#0EA5E9"/>
  </g>

  <!-- ============ Fan-out to real edge services ============ -->
  <!-- Dashed mesh-style lines, matching the "irregular mesh connections"
       convention from the icon itself. These are real, deployed
       hecate-services capabilities the agent calls today, not a roadmap. -->
  <g stroke="#0EA5E9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.55" fill="none">
    <line x1="678" y1="215" x2="150" y2="440"/>
    <line x1="678" y1="215" x2="330" y2="440"/>
    <line x1="678" y1="215" x2="510" y2="440"/>
    <line x1="678" y1="215" x2="690" y2="440"/>
    <line x1="678" y1="215" x2="870" y2="440"/>
    <line x1="678" y1="215" x2="1050" y2="440"/>
  </g>

  <text x="600" y="330" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
        font-size="15" fill="#475569" letter-spacing="0.5px">REAL EDGE SERVICES, CALLED TODAY</text>

  <!-- Graph -->
  <g>
    <circle cx="150" cy="440" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(136,426)" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" fill="none">
      <line x1="4" y1="18" x2="14" y2="6"/>
      <line x1="14" y1="6" x2="24" y2="14"/>
      <line x1="4" y1="18" x2="24" y2="14"/>
    </g>
    <g fill="#F97316">
      <circle cx="140" cy="432" r="2"/>
      <circle cx="150" cy="426" r="2"/>
      <circle cx="160" cy="440" r="2"/>
    </g>
    <text x="150" y="484" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="16" font-weight="600" fill="#E2E8F0">Graph</text>
    <text x="150" y="502" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="11" fill="#64748B">hecate-graph</text>
  </g>

  <!-- LLM -->
  <g>
    <circle cx="330" cy="440" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(316,426)" fill="#F8FAFC">
      <path d="M14,4 L16.4,11.6 L24,14 L16.4,16.4 L14,24 L11.6,16.4 L4,14 L11.6,11.6 Z"/>
    </g>
    <text x="330" y="484" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="16" font-weight="600" fill="#E2E8F0">LLM</text>
    <text x="330" y="502" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="11" fill="#64748B">hecate-llm</text>
  </g>

  <!-- RAG -->
  <g>
    <circle cx="510" cy="440" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(496,426)" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M5,5 L5,23 L23,23 L23,5 Z"/>
      <line x1="9" y1="10" x2="19" y2="10"/>
      <line x1="9" y1="14" x2="19" y2="14"/>
      <line x1="9" y1="18" x2="15" y2="18"/>
    </g>
    <text x="510" y="484" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="16" font-weight="600" fill="#E2E8F0">RAG</text>
    <text x="510" y="502" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="11" fill="#64748B">hecate-rag</text>
  </g>

  <!-- Sentinel -->
  <g>
    <circle cx="690" cy="440" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(676,425)" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M14,4 L24,8 L24,15 C24,20 19.5,24 14,26 C8.5,24 4,20 4,15 L4,8 Z"/>
    </g>
    <text x="690" y="484" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="16" font-weight="600" fill="#E2E8F0">Sentinel</text>
    <text x="690" y="502" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="11" fill="#64748B">hecate-sentinel</text>
  </g>

  <!-- Mail -->
  <g>
    <circle cx="870" cy="440" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(856,428)" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="4" y="6" width="20" height="15" rx="1.5"/>
      <path d="M4,7 L14,15 L24,7"/>
    </g>
    <text x="870" y="484" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="16" font-weight="600" fill="#E2E8F0">Mail</text>
    <text x="870" y="502" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="11" fill="#64748B">hecate-mail</text>
  </g>

  <!-- Stations (tower icon reused verbatim from macula-deployables-announcement.svg) -->
  <g>
    <circle cx="1050" cy="440" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(1036,426)">
      <path d="M12,22 L12,8 M8,22 L12,14 L16,22 M6,22 L18,22"
            fill="none" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="6" r="1.4" fill="#F8FAFC"/>
      <path d="M15,4 A3,3 0 0 1 15,8" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M9,4 A3,3 0 0 0 9,8" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text x="1050" y="484" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="16" font-weight="600" fill="#E2E8F0">Stations</text>
    <text x="1050" y="502" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="11" fill="#64748B">hecate-stations</text>
  </g>

  <line x1="300" y1="540" x2="900" y2="540" stroke="#1E293B" stroke-width="1"/>
  <text x="600" y="576" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
        font-size="15" fill="#64748B">No Big Tech in the data path. Sovereign, commons-owned infrastructure.</text>
  <text x="600" y="605" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
        font-size="14" fill="#475569">github.com/macula-io</text>
</svg>
