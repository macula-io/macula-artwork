<?xml version="1.0" encoding="UTF-8"?>
<!-- Macula deployables announcement banner. Long-form Macula logo (macula-artwork's
     own macula-full-light.svg, untouched) plus the three badge icons already used
     as each repo's own README badge (assets/macula-{cli,mcp,station}-full-*.svg),
     reused verbatim here at banner scale, not redrawn. Companion to
     macula-sdk-announcement.svg (badges: macula-cli, macula-mcp, macula-station
     instead of the four language SDKs). Each badge links to its repo; a raster
     export (PNG, and anything a platform like LinkedIn re-encodes on upload)
     loses that link, since only the SVG itself is clickable. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 630" width="1200" height="630">
  <defs>

  </defs>

  <rect width="1200" height="630" fill="#0B1220"/>

  <g transform="translate(192.00, 70.00) scale(3.4)">

  <!-- Icon -->
  <g transform="translate(4, 0) scale(0.64)">
    <!-- Subtle grid -->
    <g stroke="#1E3A5F" stroke-width="0.5" opacity="0.1">
      <line x1="0" y1="25" x2="100" y2="25"/>
      <line x1="0" y1="50" x2="100" y2="50"/>
      <line x1="0" y1="75" x2="100" y2="75"/>
      <line x1="25" y1="0" x2="25" y2="100"/>
      <line x1="50" y1="0" x2="50" y2="100"/>
      <line x1="75" y1="0" x2="75" y2="100"/>
    </g>

    <!-- Irregular mesh connections -->
    <g stroke="#0EA5E9" stroke-width="1.5" fill="none">
      <line x1="22" y1="20" x2="50" y2="32"/>
      <line x1="50" y1="32" x2="78" y2="18"/>
      <line x1="22" y1="20" x2="15" y2="52"/>
      <line x1="78" y1="18" x2="85" y2="45"/>
      <line x1="15" y1="52" x2="35" y2="55"/>
      <line x1="35" y1="55" x2="50" y2="50"/>
      <line x1="50" y1="50" x2="68" y2="48"/>
      <line x1="68" y1="48" x2="85" y2="45"/>
      <line x1="15" y1="52" x2="28" y2="80"/>
      <line x1="35" y1="55" x2="50" y2="78"/>
      <line x1="50" y1="50" x2="50" y2="78"/>
      <line x1="68" y1="48" x2="72" y2="75"/>
      <line x1="85" y1="45" x2="72" y2="75"/>
      <line x1="28" y1="80" x2="50" y2="78"/>
      <line x1="50" y1="78" x2="72" y2="75"/>
      <line x1="22" y1="20" x2="35" y2="55" stroke-dasharray="3,2" opacity="0.6"/>
      <line x1="78" y1="18" x2="68" y2="48" stroke-dasharray="3,2" opacity="0.6"/>
      <line x1="50" y1="32" x2="50" y2="50" stroke-dasharray="3,2" opacity="0.6"/>
    </g>

    <!-- Orange accents -->
    <g stroke="#F97316" stroke-width="2" fill="none" opacity="0.9">
      <line x1="35" y1="55" x2="68" y2="48"/>
      <line x1="50" y1="32" x2="35" y2="55" stroke-dasharray="4,3"/>
    </g>

    <!-- Primary nodes -->
    <g stroke="#0EA5E9" stroke-width="2" fill="#0C1929">
      <circle cx="22" cy="20" r="4"/>
      <circle cx="78" cy="18" r="4"/>
      <circle cx="15" cy="52" r="3"/>
      <circle cx="85" cy="45" r="3"/>
      <circle cx="28" cy="80" r="4"/>
      <circle cx="72" cy="75" r="4"/>
    </g>

    <!-- Hub nodes - white -->
    <g stroke="#0EA5E9" stroke-width="2" fill="white">
      <circle cx="50" cy="32" r="4"/>
      <circle cx="50" cy="78" r="4"/>
    </g>

    <!-- Central hub -->
    <circle cx="50" cy="50" r="7" stroke="#0EA5E9" stroke-width="2" fill="#0C1929"/>
    <circle cx="50" cy="50" r="3.5" fill="#0EA5E9"/>

    <!-- Secondary nodes -->
    <g stroke="#0EA5E9" stroke-width="1.5" fill="#0C1929">
      <circle cx="35" cy="55" r="3"/>
      <circle cx="68" cy="48" r="3"/>
    </g>
    <g fill="#F97316">
      <circle cx="35" cy="55" r="1.5"/>
      <circle cx="68" cy="48" r="1.5"/>
    </g>
  </g>

  <!-- Wordmark - centered vertically -->
  <text x="76" y="42"
        font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace"
        font-size="32"
        font-weight="600"
        fill="#0EA5E9"
        letter-spacing="-0.5px">MACULA</text>

  </g>

  <text x="600.0" y="270" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
        font-size="26" fill="#94A3B8">New deployables, now available</text>

  <line x1="340.0" y1="320" x2="860.0" y2="320" stroke="#1E293B" stroke-width="1"/>

  <a href="https://github.com/macula-io/macula-cli" target="_blank" rel="noopener">
    <g transform="translate(-89.54, 64.46) scale(6.7692)">
      <circle cx="54" cy="54" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <g transform="translate(42, 42)" stroke="#F8FAFC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M7,7 L13,12 L7,17"/>
        <line x1="14" y1="17" x2="19" y2="17"/>
      </g>
    </g>
    <text x="276.0" y="552.0" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
          font-size="22" font-weight="600" fill="#E2E8F0">CLI</text>
  </a>
  <a href="https://github.com/macula-io/macula-mcp" target="_blank" rel="noopener">
    <g transform="translate(234.46, 64.46) scale(6.7692)">
      <circle cx="54" cy="54" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <g transform="translate(42, 42)" stroke="#F8FAFC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M9,10 L9,17 A3,3 0 0 0 12,20 L14,20 A3,3 0 0 0 17,17 L17,10"/>
        <line x1="11" y1="6" x2="11" y2="10"/>
        <line x1="15" y1="6" x2="15" y2="10"/>
        <line x1="13" y1="20" x2="13" y2="24"/>
      </g>
    </g>
    <text x="600.0" y="552.0" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
          font-size="22" font-weight="600" fill="#E2E8F0">MCP</text>
  </a>
  <a href="https://github.com/macula-io/macula-station" target="_blank" rel="noopener">
    <g transform="translate(558.46, 64.46) scale(6.7692)">
      <circle cx="54" cy="54" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <g transform="translate(42, 42)">
        <path d="M12,22 L12,8 M8,22 L12,14 L16,22 M6,22 L18,22"
              fill="none" stroke="#F8FAFC" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="6" r="1.4" fill="#F8FAFC"/>
        <path d="M15,4 A3,3 0 0 1 15,8" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M17.5,2 A6,6 0 0 1 17.5,10" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
        <path d="M9,4 A3,3 0 0 0 9,8" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M6.5,2 A6,6 0 0 0 6.5,10" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
      </g>
    </g>
    <text x="924.0" y="552.0" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
          font-size="22" font-weight="600" fill="#E2E8F0">Station</text>
  </a>

  <text x="600.0" y="600" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace"
        font-size="16" fill="#475569">github.com/macula-io</text>
</svg>
