<?xml version="1.0" encoding="UTF-8"?>
<!-- Macrel: the mesh mascot (dark theme). Same node-and-line vocabulary as
     macula-symbol-dark.svg (11 nodes: 6 primary, 2 hub, 2 secondary +
     orange dot, 1 central hub), just arranged into a mackerel instead of
     an abstract mesh — the central hub doubles as the fish's eye, the two
     orange accent chords across the back stand in for a mackerel's tiger
     stripes, and the tail is two nodes radiating off the tail-base like
     any other hub. Speculative: paired with a possible macula → macula-erl
     rename (marking the Erlang/OTP reference implementation now that
     Go/Rust/PHP/.NET ports exist) — not an executed rename, see README. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Subtle grid background -->
  <g stroke="#38BDF8" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="25" x2="100" y2="25"/>
    <line x1="0" y1="50" x2="100" y2="50"/>
    <line x1="0" y1="75" x2="100" y2="75"/>
    <line x1="25" y1="0" x2="25" y2="100"/>
    <line x1="50" y1="0" x2="50" y2="100"/>
    <line x1="75" y1="0" x2="75" y2="100"/>
  </g>

  <!-- Body outline + tail + hub spokes -->
  <g stroke="#38BDF8" stroke-width="1.5" fill="none">
    <line x1="88" y1="50" x2="72" y2="28"/>
    <line x1="72" y1="28" x2="52" y2="16"/>
    <line x1="52" y1="16" x2="34" y2="26"/>
    <line x1="34" y1="26" x2="22" y2="44"/>
    <line x1="22" y1="44" x2="8" y2="18"/>
    <line x1="22" y1="44" x2="8" y2="68"/>
    <line x1="22" y1="44" x2="36" y2="64"/>
    <line x1="36" y1="64" x2="58" y2="70"/>
    <line x1="58" y1="70" x2="72" y2="58"/>
    <line x1="72" y1="58" x2="88" y2="50"/>
    <line x1="72" y1="28" x2="76" y2="40"/>
    <line x1="76" y1="40" x2="72" y2="58"/>

    <!-- Cross mesh (dashed) — doubles as the lateral line -->
    <line x1="88" y1="50" x2="34" y2="26" stroke-dasharray="3,2" opacity="0.5"/>
    <line x1="52" y1="16" x2="36" y2="64" stroke-dasharray="3,2" opacity="0.5"/>
    <line x1="22" y1="44" x2="76" y2="40" stroke-dasharray="3,2" opacity="0.5"/>
  </g>

  <!-- Mouth tick -->
  <g stroke="#38BDF8" stroke-width="1.2" fill="none">
    <line x1="88" y1="50" x2="95" y2="48"/>
    <line x1="88" y1="50" x2="95" y2="52"/>
  </g>

  <!-- Orange accent connections (mackerel back stripes) -->
  <g stroke="#FB923C" stroke-width="2" fill="none">
    <line x1="52" y1="16" x2="22" y2="44"/>
    <line x1="72" y1="28" x2="34" y2="26" stroke-dasharray="4,3"/>
  </g>

  <!-- Primary nodes -->
  <g stroke="#38BDF8" stroke-width="2" fill="#1E293B">
    <circle cx="88" cy="50" r="4"/>
    <circle cx="52" cy="16" r="5"/>
    <circle cx="22" cy="44" r="4"/>
    <circle cx="8" cy="18" r="3"/>
    <circle cx="8" cy="68" r="3"/>
    <circle cx="72" cy="58" r="4"/>
  </g>

  <!-- Hub nodes - white fill -->
  <g stroke="#38BDF8" stroke-width="2" fill="#F8FAFC">
    <circle cx="72" cy="28" r="4"/>
    <circle cx="58" cy="70" r="4"/>
  </g>

  <!-- Central hub - doubles as the eye -->
  <g>
    <circle cx="76" cy="40" r="7" stroke="#38BDF8" stroke-width="2" fill="#1E293B"/>
    <circle cx="76" cy="40" r="3.5" fill="#38BDF8"/>
  </g>

  <!-- Secondary nodes with orange centers -->
  <g stroke="#38BDF8" stroke-width="1.5" fill="#1E293B">
    <circle cx="34" cy="26" r="3"/>
    <circle cx="36" cy="64" r="3"/>
  </g>
  <g fill="#FB923C">
    <circle cx="34" cy="26" r="1.5"/>
    <circle cx="36" cy="64" r="1.5"/>
  </g>
</svg>
